services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: adventureworks-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SqlServer123!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - .:/var/opt/mssql/backup:ro
    restart: unless-stopped

volumes:
  sqlserver-data:
